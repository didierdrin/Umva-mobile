name: umva_v1_0_1
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1  # For state management
  
  
  page_transition: ^2.1.0  # Page animations
  
  shared_preferences: ^2.3.2  # Theme persistence
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  rxdart: ^0.28.0
  http: ^1.2.2  # Neon Data API / Neon Auth REST calls
  flutter_secure_storage: ^9.2.2  # Persists the Neon Auth session cookie

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ 
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont_wght.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-VariableFont_wght.ttf
          style: italic