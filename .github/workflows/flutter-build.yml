name: Flutter Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.5'
    - run: cd umva_v1_0_1 && flutter pub get
    - run: cd umva_v1_0_1 && flutter build apk --release
    - run: cd umva_v1_0_1 && flutter build appbundle --release
    - uses: actions/upload-artifact@v4
      with:
        name: umva-build
        path: |
          umva_v1_0_1/build/app/outputs/flutter-apk/app-release.apk
          umva_v1_0_1/build/app/outputs/bundle/release/app-release.aab

          
